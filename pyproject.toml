[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch2onepager"
version = "0.1.0"
description = "Turn an investor pitch deck into a one-page Customer Journey Market Narrative PDF."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TEN Capital Network" }]
dependencies = [
    "anthropic>=0.40",
    "pypdf>=4.0",
    "python-pptx>=0.6.23",
    "reportlab>=4.0",
    "pillow>=10.0",
    "click>=8.1",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]

[project.scripts]
pitch2onepager = "pitch2onepager.cli:main"

[tool.setuptools]
packages = ["pitch2onepager", "templates"]

[tool.setuptools.package-data]
pitch2onepager = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pitch2onepager", "templates"]
